name: 📊 Prix live
# MAJ des prix toutes les 30 min pendant les heures de marché (lun-ven)
# + un point crypto le weekend matin.

on:
  schedule:
    - cron: "*/30 7-19 * * 1-5"
    - cron: "0 8 * * 6,0"
  workflow_dispatch:

concurrency:
  group: alphabot-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  prices:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: MAJ prix + rebuild site
        run: python -m pipeline.run prices
      - name: Commit
        run: |
          git config user.name "AlphaBot"
          git config user.email "alphabot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "📊 Prix live $(date -u +%H:%M) UTC"
          git pull --rebase origin main || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4

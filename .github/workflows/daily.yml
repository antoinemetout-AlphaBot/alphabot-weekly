name: 📰 Pipeline quotidien
# Newsletter complète chaque matin (7h30 Paris l'été, 6h30 l'hiver — cron UTC).
# Tourne dans le cloud GitHub : plus aucune dépendance au PC d'Antoine.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".trigger-daily"]

concurrency:
  group: alphabot-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Pipeline complet (collecte → analyse → newsletter → site → emails)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALPHABOT_EMAIL: ${{ secrets.ALPHABOT_EMAIL }}
          ALPHABOT_PASSWORD: ${{ secrets.ALPHABOT_PASSWORD }}
          SUBSCRIBERS_CSV: ${{ secrets.SUBSCRIBERS_CSV }}
        run: python -m pipeline.run daily

      - name: Commit des données et du site
        run: |
          git config user.name "AlphaBot"
          git config user.email "alphabot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "📰 Édition du $(date +%d/%m/%Y)"
          git pull --rebase origin main || true
          git push

      - name: Préparer le déploiement Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Alerte CEO si échec
        if: failure()
        env:
          ALPHABOT_EMAIL: ${{ secrets.ALPHABOT_EMAIL }}
          ALPHABOT_PASSWORD: ${{ secrets.ALPHABOT_PASSWORD }}
        run: |
          pip install python-dotenv >/dev/null 2>&1 || true
          python - <<'EOF'
          try:
              from pipeline import mailer
              mailer.alerte_ceo("Échec du pipeline quotidien",
                  "Le run GitHub Actions a échoué. Voir l'onglet Actions du repo.")
          except Exception as e
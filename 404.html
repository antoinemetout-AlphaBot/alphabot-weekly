<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>404 - Page non trouvée | AlphaBot Weekly</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #04091a;
            --bg2: #060d1f;
            --cyan: #22d3ee;
            --blue: #3b82f6;
            --text: #e2e8f0;
            --muted: #64748b;
            --border: rgba(255, 255, 255, 0.08);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* ── BG ── */
        .bg-wrap {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .bg-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(59, 130, 246, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.025) 1px, transparent 1px);
            background-size: 60px 60px;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
        }

        .o1 {
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.09), transparent 65%);
            top: -300px;
            left: -250px;
            animation: of 9s ease-in-out infinite alternate;
        }

        .o2 {
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.08), transparent 65%);
            bottom: -200px;
            right: -200px;
            animation: of 11s ease-in-out infinite alternate-reverse;
        }

        .o3 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.06), transparent 65%);
            top: 50%;
            left: 50%;
            animation: of 7s ease-in-out infinite alternate;
        }

        @keyframes of {
            from {
                transform: translate(0, 0) scale(1);
            }
            to {
                transform: translate(25px, 20px) scale(1.06);
            }
        }

        /* ── CONTENT ── */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
        }

        .error-code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(80px, 15vw, 160px);
            font-weight: 700;
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1;
            margin-bottom: 20px;
        }

        .error-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            margin: 0 0 16px 0;
        }

        .error-message {
            font-size: 16px;
            color: var(--muted);
            margin: 0 0 32px 0;
            line-height: 1.6;
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, var(--blue), var(--cyan));
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            border: 1px solid rgba(34, 211, 238, 0.3);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(34, 211, 238, 0.3);
            border-color: rgba(34, 211, 238, 0.6);
        }

        .cta-button:active {
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            .error-code {
                font-size: clamp(60px, 12vw, 100px);
            }

            .error-title {
                font-size: 24px;
            }

            .error-message {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-wrap">
        <div class="bg-grid"></div>
        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"></div>
    </div>

    <div class="container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Page non trouvée</h2>
        <p class="error-message">Cette page n'existe pas ou a été déplacée.</p>
        <a href="index.html?v=2" class="cta-button">Retour à l'accueil</a>
    </div>
</body>
</html>

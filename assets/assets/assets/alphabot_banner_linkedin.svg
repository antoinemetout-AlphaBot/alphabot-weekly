<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1584 396" width="1584" height="396">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04091a"/>
      <stop offset="40%" stop-color="#060d1f"/>
      <stop offset="100%" stop-color="#04091a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f5c842"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="30%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#f5c842"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#22d3ee" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feFlood flood-color="#f5c842" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orbBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <filter id="orbBlurSm" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="bannerClip">
      <rect width="1584" height="396" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- Fond -->
    <rect width="1584" height="396" fill="url(#bgGrad)"/>

    <!-- Grille subtile -->
    <g opacity="0.035" stroke="#3b82f6" stroke-width="0.5">
      <line x1="0" y1="66" x2="1584" y2="66"/>
      <line x1="0" y1="132" x2="1584" y2="132"/>
      <line x1="0" y1="198" x2="1584" y2="198"/>
      <line x1="0" y1="264" x2="1584" y2="264"/>
      <line x1="0" y1="330" x2="1584" y2="330"/>
      <line x1="132" y1="0" x2="132" y2="396"/>
      <line x1="264" y1="0" x2="264" y2="396"/>
      <line x1="396" y1="0" x2="396" y2="396"/>
      <line x1="528" y1="0" x2="528" y2="396"/>
      <line x1="660" y1="0" x2="660" y2="396"/>
      <line x1="792" y1="0" x2="792" y2="396"/>
      <line x1="924" y1="0" x2="924" y2="396"/>
      <line x1="1056" y1="0" x2="1056" y2="396"/>
      <line x1="1188" y1="0" x2="1188" y2="396"/>
      <line x1="1320" y1="0" x2="1320" y2="396"/>
      <line x1="1452" y1="0" x2="1452" y2="396"/>
    </g>

    <!-- Orbes -->
    <circle cx="250" cy="100" r="200" fill="#22d3ee" opacity="0.05" filter="url(#orbBlur)"/>
    <circle cx="800" cy="350" r="250" fill="#3b82f6" opacity="0.04" filter="url(#orbBlur)"/>
    <circle cx="1350" cy="80" r="180" fill="#f5c842" opacity="0.035" filter="url(#orbBlur)"/>
    <circle cx="1100" cy="200" r="150" fill="#22d3ee" opacity="0.03" filter="url(#orbBlurSm)"/>

    <!-- ═══ GRANDE COURBE FINANCIÈRE sur toute la largeur ═══ -->
    <!-- Zone sous la courbe -->
    <path d="M0,340 C80,330 120,310 200,300 C280,290 320,320 400,295 C480,270 520,280 600,250 C680,220 720,240 800,210 C880,180 920,200 1000,170 C1080,140 1120,155 1200,130 C1280,105 1350,95 1420,80 C1460,72 1520,60 1584,50 L1584,396 L0,396 Z"
          fill="url(#chartFill)"/>
    <!-- Courbe -->
    <path d="M0,340 C80,330 120,310 200,300 C280,290 320,320 400,295 C480,270 520,280 600,250 C680,220 720,240 800,210 C880,180 920,200 1000,170 C1080,140 1120,155 1200,130 C1280,105 1350,95 1420,80 C1460,72 1520,60 1584,50"
          fill="none" stroke="url(#chartGrad)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Points lumineux sur la courbe -->
    <circle cx="400" cy="295" r="3" fill="#22d3ee" opacity="0.5"/>
    <circle cx="800" cy="210" r="3.5" fill="#22d3ee" opacity="0.6"/>
    <circle cx="1200" cy="130" r="4" fill="#22d3ee" opacity="0.7"/>
    <circle cx="1500" cy="55" r="5" fill="#f5c842" opacity="0.8" filter="url(#glowGold)"/>

    <!-- Petit indicateur haussier sur le dernier point -->
    <g transform="translate(1500, 30)" opacity="0.7">
      <polygon points="0,-8 6,2 -6,2" fill="#22c55e"/>
    </g>

    <!-- Chandelles japonaises décoratives à droite -->
    <g opacity="0.12">
      <!-- Chandelle 1 - verte -->
      <line x1="1300" y1="180" x2="1300" y2="110" stroke="#22c55e" stroke-width="1"/>
      <rect x="1295" y="130" width="10" height="35" fill="#22c55e" rx="1"/>
      <!-- Chandelle 2 - rouge -->
      <line x1="1330" y1="190" x2="1330" y2="125" stroke="#ef4444" stroke-width="1"/>
      <rect x="1325" y="135" width="10" height="30" fill="#ef4444" rx="1"/>
      <!-- Chandelle 3 - verte -->
      <line x1="1360" y1="170" x2="1360" y2="95" stroke="#22c55e" stroke-width="1"/>
      <rect x="1355" y="105" width="10" height="40" fill="#22c55e" rx="1"/>
      <!-- Chandelle 4 - verte -->
      <line x1="1390" y1="150" x2="1390" y2="75" stroke="#22c55e" stroke-width="1"/>
      <rect x="1385" y="85" width="10" height="38" fill="#22c55e" rx="1"/>
      <!-- Chandelle 5 - rouge -->
      <line x1="1420" y1="135" x2="1420" y2="65" stroke="#ef4444" stroke-width="1"/>
      <rect x="1415" y="75" width="10" height="30" fill="#ef4444" rx="1"/>
      <!-- Chandelle 6 - verte grande -->
      <line x1="1450" y1="120" x2="1450" y2="40" stroke="#22c55e" stroke-width="1"/>
      <rect x="1445" y="50" width="10" height="45" fill="#22c55e" rx="1"/>
    </g>

    <!-- ═══ SCAN LINE ═══ -->
    <rect x="0" y="197" width="1584" height="2" fill="url(#scanGrad)" opacity="0.15"/>

    <!-- ═══ HEXAGONE IA (gauche, zone photo profil) ═══ -->
    <g transform="translate(160, 198)">
      <!-- Hexagone glow -->
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5"
               fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.1" filter="url(#glow)"/>
      <!-- Hexagone -->
      <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31"
               fill="rgba(4,9,26,0.9)" stroke="url(#accentGrad)" stroke-width="1.8"/>
      <!-- Oeil IA -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#22d3ee" stroke-width="2" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="6" fill="#22d3ee" opacity="0.9"/>
      <circle cx="0" cy="0" r="2.5" fill="#fff"/>
      <!-- Circuits -->
      <line x1="16" y1="0" x2="38" y2="0" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
      <line x1="-16" y1="0" x2="-38" y2="0" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
      <line x1="0" y1="-16" x2="0" y2="-40" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
      <line x1="0" y1="16" x2="0" y2="40" stroke="#22d3ee" stroke-width="1.2" opacity="0.6"/>
      <line x1="11" y1="-11" x2="28" y2="-28" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
      <line x1="-11" y1="-11" x2="-28" y2="-28" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
      <line x1="11" y1="11" x2="28" y2="28" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
      <line x1="-11" y1="11" x2="-28" y2="28" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
      <!-- Noeuds -->
      <circle cx="38" cy="0" r="3" fill="#22d3ee" opacity="0.7"/>
      <circle cx="-38" cy="0" r="3" fill="#22d3ee" opacity="0.7"/>
      <circle cx="0" cy="-40" r="3" fill="#22d3ee" opacity="0.7"/>
      <circle cx="0" cy="40" r="3" fill="#22d3ee" opacity="0.7"/>
      <!-- Arc orbital -->
      <ellipse cx="0" cy="0" rx="48" ry="20" fill="none" stroke="#f5c842" stroke-width="0.8"
               opacity="0.2" transform="rotate(-20)"/>
    </g>

    <!-- ═══ TEXTE PRINCIPAL (centré-droit) ═══ -->
    <!-- ALPHABOT -->
    <text x="570" y="155" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="68" font-weight="900" letter-spacing="4">
      <tspan fill="white">ALPHA</tspan><tspan fill="url(#accentGrad)">BOT</tspan>
    </text>

    <!-- WEEKLY -->
    <text x="573" y="190" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="18" font-weight="600" letter-spacing="10" fill="#64748b">
      WEEKLY
    </text>

    <!-- Ligne accent -->
    <rect x="570" y="203" width="240" height="2" rx="1" fill="url(#accentGrad)" opacity="0.5"/>

    <!-- Tagline -->
    <text x="570" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="17" font-weight="400" fill="#94a3b8" letter-spacing="0.5">
      L'IA d&#233;crypte les march&#233;s pour vous
    </text>

    <!-- ═══ KPI CARDS ═══ -->
    <!-- Card 1 : Robots -->
    <g transform="translate(570, 258)">
      <rect x="0" y="0" width="135" height="52" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="12" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.5">ROBOTS TRADERS</text>
      <text x="12" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#22d3ee">3</text>
      <text x="35" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#64748b">actifs 24/7</text>
    </g>

    <!-- Card 2 : Capital -->
    <g transform="translate(720, 258)">
      <rect x="0" y="0" width="145" height="52" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="12" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.5">CAPITAL INVESTI</text>
      <text x="12" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#f5c842">30 000&#8364;</text>
    </g>

    <!-- Card 3 : Newsletter -->
    <g transform="translate(880, 258)">
      <rect x="0" y="0" width="135" height="52" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <text x="12" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="600" fill="#64748b" letter-spacing="0.5">NEWSLETTER</text>
      <text x="12" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#22c55e">Gratuite</text>
    </g>

    <!-- ═══ BADGE LIVE (en haut à droite) ═══ -->
    <g transform="translate(1130, 258)">
      <rect x="0" y="0" width="78" height="52" rx="10" fill="rgba(34,197,94,0.07)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
      <circle cx="22" cy="26" r="5" fill="#22c55e" opacity="0.9">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" fill="#22c55e" letter-spacing="1">LIVE</text>
    </g>

    <!-- ═══ LIGNE TOP ACCENT ═══ -->
    <rect x="0" y="0" width="1584" height="3" fill="url(#accentGrad)" opacity="0.7"/>

    <!-- ═══ LIGNE BOTTOM ACCENT ═══ -->
    <rect x="0" y="393" width="1584" height="3" fill="url(#accentGrad)" opacity="0.3"/>
  </g>
</svg>

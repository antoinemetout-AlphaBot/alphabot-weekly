<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Gradient principal cyan → or -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f5c842"/>
    </linearGradient>

    <!-- Gradient fond -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#04091a"/>
    </radialGradient>

    <!-- Glow cyan -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#22d3ee" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow or subtil -->
    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feFlood flood-color="#f5c842" flood-opacity="0.35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow bleu pour l'orbe -->
    <filter id="orbGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <!-- Clip circulaire LinkedIn -->
    <clipPath id="circleClip">
      <circle cx="400" cy="400" r="395"/>
    </clipPath>

    <!-- Gradient pour le graphique -->
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="40%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f5c842"/>
    </linearGradient>

    <!-- Gradient pour le remplissage sous la courbe -->
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>

    <!-- Gradient bordure -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f5c842" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Fond avec clip circulaire -->
  <g clip-path="url(#circleClip)">
    <!-- Fond principal -->
    <rect width="800" height="800" fill="url(#bgGrad)"/>

    <!-- Grille subtile -->
    <g opacity="0.04" stroke="#3b82f6" stroke-width="0.8">
      <line x1="0" y1="100" x2="800" y2="100"/>
      <line x1="0" y1="200" x2="800" y2="200"/>
      <line x1="0" y1="300" x2="800" y2="300"/>
      <line x1="0" y1="400" x2="800" y2="400"/>
      <line x1="0" y1="500" x2="800" y2="500"/>
      <line x1="0" y1="600" x2="800" y2="600"/>
      <line x1="0" y1="700" x2="800" y2="700"/>
      <line x1="100" y1="0" x2="100" y2="800"/>
      <line x1="200" y1="0" x2="200" y2="800"/>
      <line x1="300" y1="0" x2="300" y2="800"/>
      <line x1="400" y1="0" x2="400" y2="800"/>
      <line x1="500" y1="0" x2="500" y2="800"/>
      <line x1="600" y1="0" x2="600" y2="800"/>
      <line x1="700" y1="0" x2="700" y2="800"/>
    </g>

    <!-- Orbes lumineuses -->
    <circle cx="200" cy="250" r="200" fill="#22d3ee" opacity="0.06" filter="url(#orbGlow)"/>
    <circle cx="620" cy="550" r="180" fill="#f5c842" opacity="0.04" filter="url(#orbGlow)"/>
    <circle cx="500" cy="200" r="120" fill="#3b82f6" opacity="0.05" filter="url(#orbGlow)"/>

    <!-- ═══ GRAPHIQUE FINANCIER (fond) ═══ -->
    <!-- Zone sous la courbe -->
    <path d="M100,580 L180,540 L260,555 L340,480 L420,500 L500,420 L560,380 L620,350 L700,290 L700,620 L100,620 Z"
          fill="url(#chartFill)" opacity="0.5"/>

    <!-- Courbe principale -->
    <path d="M100,580 L180,540 L260,555 L340,480 L420,500 L500,420 L560,380 L620,350 L700,290"
          fill="none" stroke="url(#chartGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

    <!-- Points lumineux sur la courbe -->
    <circle cx="500" cy="420" r="4" fill="#22d3ee" opacity="0.6"/>
    <circle cx="620" cy="350" r="4" fill="#22d3ee" opacity="0.6"/>
    <circle cx="700" cy="290" r="5" fill="#f5c842" opacity="0.7" filter="url(#glowGold)"/>

    <!-- ═══ SYMBOLE CENTRAL : Hexagone IA ═══ -->
    <g transform="translate(400, 310)">
      <!-- Hexagone extérieur (glow) -->
      <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55"
               fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.15" filter="url(#glowCyan)"/>

      <!-- Hexagone principal -->
      <polygon points="0,-95 82,-47.5 82,47.5 0,95 -82,47.5 -82,-47.5"
               fill="rgba(4,9,26,0.85)" stroke="url(#mainGrad)" stroke-width="2.5"/>

      <!-- Circuit IA à l'intérieur -->
      <!-- Cercle central (oeil IA) -->
      <circle cx="0" cy="0" r="22" fill="none" stroke="#22d3ee" stroke-width="2.5" filter="url(#glowCyan)"/>
      <circle cx="0" cy="0" r="9" fill="#22d3ee" opacity="0.9"/>
      <circle cx="0" cy="0" r="4" fill="#fff"/>

      <!-- Lignes de circuit -->
      <line x1="22" y1="0" x2="55" y2="0" stroke="#22d3ee" stroke-width="1.5" opacity="0.7"/>
      <line x1="-22" y1="0" x2="-55" y2="0" stroke="#22d3ee" stroke-width="1.5" opacity="0.7"/>
      <line x1="0" y1="-22" x2="0" y2="-58" stroke="#22d3ee" stroke-width="1.5" opacity="0.7"/>
      <line x1="0" y1="22" x2="0" y2="58" stroke="#22d3ee" stroke-width="1.5" opacity="0.7"/>

      <!-- Lignes diagonales -->
      <line x1="16" y1="-16" x2="42" y2="-42" stroke="#3b82f6" stroke-width="1.2" opacity="0.5"/>
      <line x1="-16" y1="-16" x2="-42" y2="-42" stroke="#3b82f6" stroke-width="1.2" opacity="0.5"/>
      <line x1="16" y1="16" x2="42" y2="42" stroke="#3b82f6" stroke-width="1.2" opacity="0.5"/>
      <line x1="-16" y1="16" x2="-42" y2="42" stroke="#3b82f6" stroke-width="1.2" opacity="0.5"/>

      <!-- Noeuds aux extrémités -->
      <circle cx="55" cy="0" r="4" fill="#22d3ee" opacity="0.8"/>
      <circle cx="-55" cy="0" r="4" fill="#22d3ee" opacity="0.8"/>
      <circle cx="0" cy="-58" r="4" fill="#22d3ee" opacity="0.8"/>
      <circle cx="0" cy="58" r="4" fill="#22d3ee" opacity="0.8"/>
      <circle cx="42" cy="-42" r="3" fill="#3b82f6" opacity="0.7"/>
      <circle cx="-42" cy="-42" r="3" fill="#3b82f6" opacity="0.7"/>
      <circle cx="42" cy="42" r="3" fill="#3b82f6" opacity="0.7"/>
      <circle cx="-42" cy="42" r="3" fill="#3b82f6" opacity="0.7"/>

      <!-- Arc orbital -->
      <ellipse cx="0" cy="0" rx="70" ry="30" fill="none" stroke="#f5c842" stroke-width="1"
               opacity="0.25" transform="rotate(-25)"/>
    </g>

    <!-- ═══ TEXTE "ALPHA" ═══ -->
    <text x="400" y="485" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="72" font-weight="900" letter-spacing="8" fill="white">
      ALPHA
    </text>

    <!-- ═══ TEXTE "BOT" avec accent gold ═══ -->
    <text x="400" y="555" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="60" font-weight="900" letter-spacing="12">
      <tspan fill="url(#mainGrad)">BOT</tspan>
    </text>

    <!-- Ligne séparatrice sous BOT -->
    <line x1="280" y1="575" x2="520" y2="575" stroke="url(#mainGrad)" stroke-width="2" opacity="0.6"/>

    <!-- ═══ TEXTE "WEEKLY" ═══ -->
    <text x="400" y="610" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="22" font-weight="600" letter-spacing="8" fill="#64748b">
      WEEKLY
    </text>

    <!-- ═══ BADGE "LIVE" ═══ -->
    <g transform="translate(400, 658)">
      <rect x="-52" y="-14" width="104" height="28" rx="14" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.35)" stroke-width="1"/>
      <circle cx="-32" cy="0" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="6" y="5" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#22c55e" letter-spacing="2">LIVE</text>
    </g>

    <!-- ═══ Petits indicateurs (flèche verte haussière) ═══ -->
    <g transform="translate(620, 260)" opacity="0.7">
      <polygon points="0,-12 8,4 -8,4" fill="#22c55e" filter="url(#glowCyan)"/>
      <text x="0" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#22c55e">+2.4%</text>
    </g>
  </g>

  <!-- Bordure circulaire avec gradient -->
  <circle cx="400" cy="400" r="395" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Arc lumineux en haut -->
  <path d="M 150 120 A 395 395 0 0 1 650 120" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
</svg>

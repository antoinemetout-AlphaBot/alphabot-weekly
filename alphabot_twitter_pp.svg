<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#04091a"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="cyanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#f5c842"/>
    </linearGradient>
    <linearGradient id="goldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c842"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circle">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>

  <!-- Fond -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Grille subtile -->
  <g opacity="0.06" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Orbe cyan en haut gauche -->
  <circle cx="80" cy="80" r="120" fill="rgba(34,211,238,0.07)" filter="url(#softGlow)"/>
  <!-- Orbe gold en bas droite -->
  <circle cx="320" cy="320" r="100" fill="rgba(245,200,66,0.07)" filter="url(#softGlow)"/>

  <!-- Cercle principal - fond légèrement plus clair -->
  <circle cx="200" cy="200" r="140" fill="rgba(255,255,255,0.03)" stroke="rgba(34,211,238,0.2)" stroke-width="1.5"/>

  <!-- Graphique sparkline style (courbe montante) -->
  <polyline
    points="95,260 125,235 150,245 175,210 200,220 225,185 255,195 280,160 305,148"
    fill="none"
    stroke="url(#cyanGold)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
    opacity="0.7"/>

  <!-- Points sur la courbe -->
  <circle cx="125" cy="235" r="3" fill="#22d3ee" opacity="0.6"/>
  <circle cx="175" cy="210" r="3" fill="#22d3ee" opacity="0.6"/>
  <circle cx="225" cy="185" r="3" fill="#f5c842" opacity="0.6"/>
  <circle cx="280" cy="160" r="3" fill="#f5c842" opacity="0.8"/>
  <circle cx="305" cy="148" r="5" fill="#f5c842" filter="url(#glow)"/>

  <!-- Robot head - corps -->
  <rect x="163" y="108" width="74" height="58" rx="10" fill="rgba(255,255,255,0.05)" stroke="url(#cyanGold)" stroke-width="2"/>

  <!-- Robot yeux -->
  <rect x="178" y="122" width="16" height="12" rx="4" fill="url(#cyanGold)" opacity="0.9" filter="url(#glow)"/>
  <rect x="206" y="122" width="16" height="12" rx="4" fill="url(#cyanGold)" opacity="0.9" filter="url(#glow)"/>

  <!-- Robot bouche - ligne de données -->
  <rect x="178" y="144" width="44" height="3" rx="2" fill="rgba(34,211,238,0.5)"/>
  <rect x="178" y="144" width="28" height="3" rx="2" fill="rgba(34,211,238,0.9)"/>

  <!-- Antenne -->
  <line x1="200" y1="108" x2="200" y2="90" stroke="rgba(34,211,238,0.6)" stroke-width="2"/>
  <circle cx="200" cy="87" r="5" fill="#22d3ee" filter="url(#glow)"/>

  <!-- Oreilles robot -->
  <rect x="150" y="122" width="13" height="20" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(34,211,238,0.3)" stroke-width="1.5"/>
  <rect x="237" y="122" width="13" height="20" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(34,211,238,0.3)" stroke-width="1.5"/>

  <!-- Texte ALPHABOT -->
  <text x="200" y="300" text-anchor="middle" font-family="'Arial Black', sans-serif" font-size="32" font-weight="900" letter-spacing="3" fill="url(#cyanGold)" filter="url(#glow)">ALPHABOT</text>

  <!-- Texte WEEKLY -->
  <text x="200" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="6" fill="rgba(255,255,255,0.4)">W E E K L Y</text>

  <!-- Ligne déco sous le texte -->
  <line x1="140" y1="335" x2="260" y2="335" stroke="url(#cyanGold)" stroke-width="1" opacity="0.4"/>

  <!-- Badge IA -->
  <rect x="167" y="344" width="66" height="20" rx="10" fill="rgba(34,211,238,0.1)" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
  <text x="200" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#22d3ee">100% IA</text>

  <!-- Bordure externe subtile -->
  <circle cx="200" cy="200" r="196" fill="none" stroke="url(#cyanGold)" stroke-width="2" opacity="0.15"/>
</svg>
